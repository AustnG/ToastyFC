[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "toasty-film"
version = "0.1.0"
description = "Local RTX 3070 NVENC + Gemini AI match video review, calibration, 1080p highlight renderer, and DaVinci Resolve FCPXML pipeline for Toasty FC."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "google-genai>=1.0.0",
  "google-auth>=2.29.0",
  "requests>=2.31.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "pillow>=10.3.0",
  "pydantic>=2.7.0",
  "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "httpx>=0.27.0",
]

[project.scripts]
toasty-film = "toasty_film.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
toasty_film = ["review_ui/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
